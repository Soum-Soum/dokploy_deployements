version: '3.1'
services:
  web:
    image: odoo:latest
    command: -- -i base -d ${DB_NAME}
    restart: always
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=${DB_HOST}
      - PORT=${DB_PORT:-5432}
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
  # db:
  #   image: postgres:latest
  #   environment:
  #     - POSTGRES_DB=${DB_NAME}
  #     - POSTGRES_PASSWORD=${DB_PASSWORD}
  #     - POSTGRES_USER=${DB_USER}
  #     - PGDATA=/var/lib/postgresql/data/pgdata
  #   restart: always
  #   volumes:
  #     - odoo-db-data:/var/lib/postgresql/data/pgdata
volumes:
  odoo-web-data:
  odoo-db-data: